# The ordinary offline price beside the front box cover, as a ZIP. READ-ONLY.
#
# «احتاج الالعاب التي لديها صورة العلبه الامامي المستطيل مع سعر اللعبه خيار
#  اوفلاين عادي … فقط الالعاب التي لديها غلاف العلبة الأمامي ضعها في ملف zip»
#
# It reads the catalogue and downloads the covers; it writes to neither D1 nor
# R2. No price, cost, stock, hidden flag, option, type, trade-in value, display
# order or sales figure is written by anything this runs, and cost is never
# read into its output.
#
# Runs here rather than in the agent's sandbox because the covers live in R2
# and on Nintendo's CDN, and only this runner can reach both.
name: Offline prices and front covers

on:
  workflow_dispatch:
  # A new or edited exporter runs itself, so its answer is waiting on the
  # branch. It reads and never writes, so a push trigger risks nothing.
  push:
    branches: ["claude/**"]
    paths:
      - scripts/offline-cover-export.mjs
      - scripts/lib/offline-cover.mjs
      - scripts/lib/offline-cover-entry.ts
      - .github/workflows/offline-cover-export.yml

permissions:
  contents: read

concurrency:
  group: offline-cover-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The runner's default npm 10 refuses this lockfile on Linux.
      - run: npm install -g npm@11.19.1
      - run: npm ci --no-audit --no-fund
      - name: Mask identifiers
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          echo "::add-mask::$ACCOUNT_ID"
          echo "::add-mask::$DATABASE_ID"
      - name: Read the catalogue, download the covers, pack the ZIP
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: node scripts/offline-cover-export.mjs
      # The ZIP is already compressed; zipping it again only costs time.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-covers
          path: |
            offline-covers.zip
            offline-cover-export.md
            offline-cover-summary.md
          compression-level: 0
          if-no-files-found: warn
      # LAST in the log, deliberately: a job log is read as a tail, and these are
      # the games the owner asked about by name.
      - name: The named games, last in the log
        if: always()
        run: cat offline-cover-summary.md || true
