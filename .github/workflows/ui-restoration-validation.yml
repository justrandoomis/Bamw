name: UI restoration validation

on:
  pull_request:
    branches: [main]
    paths:
      - src/styles.css
      - src/styles-identity.test.ts
      - scripts/ui-restoration-visual.mjs
      - .github/workflows/ui-restoration-validation.yml

permissions:
  contents: read

concurrency:
  group: ui-restoration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      # npm, from the committed lockfile. These jobs opened with
      # `bun install --frozen-lockfile`, and there has been no bun lockfile
      # since the tree moved to npm — so every one of them died on its install
      # step, taking the audit and repair tooling with it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.19.1
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        if: always()
        run: npm run test
      - name: Lint
        if: always()
        run: npm run lint
      - name: Production build
        if: always()
        run: npm run build

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - name: Check out restored branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: restored
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@11.19.1
      # Both trees, from each one's own committed lockfile. The baseline
      # checkout can predate the move to npm, so it falls back to a plain
      # install rather than failing the comparison outright.
      - name: Install both trees
        run: |
          for tree in baseline restored; do
            if [ -f "$tree/package-lock.json" ]; then
              (cd "$tree" && npm ci --no-audit --no-fund)
            else
              (cd "$tree" && npm install --no-audit --no-fund)
            fi
          done
      - name: Capture before and after at the acceptance viewports
        shell: bash
        run: |
          set -euo pipefail
          (cd baseline && npx vite dev --host 127.0.0.1 --port 4173 > ../baseline.log 2>&1) &
          baseline_pid=$!
          (cd restored && npx vite dev --host 127.0.0.1 --port 4174 > ../restored.log 2>&1) &
          restored_pid=$!
          trap 'kill "$baseline_pid" "$restored_pid" 2>/dev/null || true' EXIT
          for port in 4173 4174; do
            ready=0
            for attempt in {1..90}; do
              if curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              echo "Server on port ${port} did not become ready"
              tail -100 baseline.log restored.log || true
              exit 1
            fi
          done
          chrome_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          cd restored
          BASELINE_URL=http://127.0.0.1:4173 \
          RESTORED_URL=http://127.0.0.1:4174 \
          CHROMIUM_PATH="$chrome_path" \
          OUTPUT_DIR=visual-restoration \
          bun scripts/ui-restoration-visual.mjs
      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-restoration-comparison
          path: |
            restored/visual-restoration
            baseline.log
            restored.log
          if-no-files-found: warn
          retention-days: 7
