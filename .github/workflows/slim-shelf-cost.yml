# TEMPORARY — what the games shelf loses by fetching `?slim=1`.
#
# READ ONLY. One SELECT against store_kv, no writes, no deploy. The report is
# printed to the job log as well as uploaded, because artifact download is not
# available from the sandbox that reads these runs.
name: Slim shelf cost

on:
  workflow_dispatch:
  push:
    branches: [claude/gaming-platform-issues-keb1be]
    paths:
      - .github/workflows/slim-shelf-cost.yml
      - scripts/slim-shelf-cost.mjs

permissions:
  contents: read

concurrency:
  group: slim-shelf-cost
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.19.1
      - run: npm ci --no-audit --no-fund
      - name: Mask identifiers
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          echo "::add-mask::$ACCOUNT_ID"
          echo "::add-mask::$DATABASE_ID"
      - name: Measure
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: node scripts/slim-shelf-cost.mjs
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slim-shelf-cost
          path: slim-shelf-cost.md
          if-no-files-found: warn
