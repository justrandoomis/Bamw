# TEMPORARY — how complete every canonical Nintendo game is, field by field.
#
# READ ONLY. Field names come from the importer's own schema, never guessed.
name: Details audit

on:
  workflow_dispatch:
    inputs:
      offset:
        description: "Skip this many games"
        type: string
        default: "0"
      limit:
        description: "Audit at most this many (0 = no limit)"
        type: string
        default: "0"
  push:
    branches: [claude/nintendo-product-template-schema-6dtvza]
    paths:
      - .github/workflows/details-audit.yml
      - scripts/details-audit.mjs

permissions:
  contents: read

concurrency:
  group: details-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # npm, from the committed lockfile. These jobs opened with
      # `bun install --frozen-lockfile`, and there has been no bun lockfile
      # since the tree moved to npm — so every one of them died on its install
      # step, taking the audit and repair tooling with it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.19.1
      - run: npm ci --no-audit --no-fund
      - name: Mask identifiers
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          echo "::add-mask::$ACCOUNT_ID"
          echo "::add-mask::$DATABASE_ID"
      - name: Audit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          OFFSET: ${{ inputs.offset }}
          LIMIT: ${{ inputs.limit }}
        run: node scripts/details-audit.mjs --offset=${OFFSET:-0} --limit=${LIMIT:-0}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: details-audit
          path: details-audit.md
          if-no-files-found: warn
