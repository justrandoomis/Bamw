# Which build is actually serving banan.to. READ ONLY.
#
# Production has two deploy paths: this repository's `deploy.yml`, and somebody
# running `wrangler` on a laptop. Cloudflare records a commit for the first and
# nothing for the second, so after a laptop deploy the deployment list cannot
# answer "what is live?" — and two branches have since fixed the same faults in
# opposite ways. This asks the running Worker instead.
name: What is live

on:
  workflow_dispatch:
    inputs:
      origin:
        description: "Origin to fingerprint"
        type: string
        default: "https://banan.to"
  push:
    branches: ["claude/**"]
    paths:
      - scripts/whats-live.mjs
      - .github/workflows/whats-live.yml

permissions:
  contents: read

concurrency:
  group: whats-live
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mask identifiers
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "::add-mask::$ACCOUNT_ID"
      - name: Probe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/whats-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whats-live
          path: whats-live.md
          if-no-files-found: warn
      - name: Summary
        if: always()
        run: cat whats-live.md >> "$GITHUB_STEP_SUMMARY" || true
