# TEMPORARY — sync devicePerformance from documents into the relational tables.
#
# Dry run by default. Writes go through the application's own
# syncGameDevicePerformance, over the REST D1 layer d1.server.ts already uses
# when no Worker binding is present, so the row mapping is the Worker's.
name: Sync performance

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write the changes (leave unchecked for a dry run)"
        type: boolean
        default: false
      batch:
        description: "Products per batch"
        default: "5"
      limit:
        description: "Maximum products this run syncs"
        default: "1000"
  push:
    branches: [claude/nintendo-product-template-schema-6dtvza]
    paths:
      - .github/workflows/sync-performance.yml
      - scripts/sync-performance.mjs
      - scripts/lib/perf-sync-entry.ts

permissions:
  contents: read

concurrency:
  group: sync-performance
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # npm, from the committed lockfile. These jobs opened with
      # `bun install --frozen-lockfile`, and there has been no bun lockfile
      # since the tree moved to npm — so every one of them died on its install
      # step, taking the audit and repair tooling with it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.19.1
      - run: npm ci --no-audit --no-fund
      - name: Mask identifiers
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          echo "::add-mask::$ACCOUNT_ID"
          echo "::add-mask::$DATABASE_ID"
      - name: Sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          APPLY: ${{ inputs.apply }}
          BATCH: ${{ inputs.batch }}
          LIMIT: ${{ inputs.limit }}
        run: |
          args=""
          [ "$APPLY" = "true" ] && args="$args --apply"
          [ -n "$BATCH" ] && args="$args --batch=$BATCH"
          [ -n "$LIMIT" ] && args="$args --limit=$LIMIT"
          node scripts/sync-performance.mjs $args
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-performance
          path: sync-performance.md
          if-no-files-found: warn
