# TEMPORARY — put product documents back the way a run found them.
#
# Reads the `research-import-before-*` artifacts a write run uploaded before it
# touched anything, and restores those documents. Dry run by default. The only
# D1 statement it can write is a single INSERT against one product's overlay row
# by immutable id, and it verifies the row byte for byte afterwards.
name: Restore products

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write the changes (leave unchecked for a dry run)"
        type: boolean
        default: false
      runs:
        description: "Space-separated workflow run ids whose pre-change artifacts to restore from"
        default: "33151869780 33166150208"
      artifact:
        description: "Artifact name pattern to download"
        default: "research-import-before-*"
      products:
        description: "Optional comma-separated product ids (default: everything in the artifacts)"
        default: ""
  # A workflow that has only ever been described is not yet a workflow GitHub
  # will dispatch on a branch. One push registers it; it is a dry run.
  push:
    branches: [claude/nintendo-product-template-schema-6dtvza]
    paths:
      - .github/workflows/restore-products.yml
      - scripts/restore-products.mjs

permissions:
  contents: read
  actions: read

concurrency:
  group: research-import
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # npm, from the committed lockfile. These jobs opened with
      # `bun install --frozen-lockfile`, and there has been no bun lockfile
      # since the tree moved to npm — so every one of them died on its install
      # step, taking the audit and repair tooling with it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.19.1
      - run: npm ci --no-audit --no-fund
      - name: Fetch the pre-change documents
        env:
          RUNS: ${{ inputs.runs || '33151869780 33166150208' }}
          PATTERN: ${{ inputs.artifact }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p restore-input
          for run in $RUNS; do
            echo "run $run"
            ids=$(curl -sS -H "authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/actions/runs/$run/artifacts?per_page=100" \
              | jq -r --arg p "$PATTERN" '.artifacts[] | select(.name | test($p | gsub("\\*"; ".*"))) | "\(.id) \(.name)"')
            [ -n "$ids" ] || { echo "no artifact matching $PATTERN on run $run"; exit 1; }
            while read -r id name; do
              [ -n "$id" ] || continue
              echo "  artifact $name ($id)"
              curl -sSL -H "authorization: Bearer $GH_TOKEN" \
                -o "/tmp/$id.zip" \
                "https://api.github.com/repos/$REPO/actions/artifacts/$id/zip"
              unzip -oq "/tmp/$id.zip" -d "restore-input/$run-$name"
            done <<< "$ids"
          done
          find restore-input -name '*.before.json' | wc -l
      - name: Mask identifiers
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "::add-mask::$ACCOUNT_ID"
      - name: Restore
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          APPLY: ${{ inputs.apply }}
          PRODUCTS: ${{ inputs.products }}
        run: |
          args="--from=restore-input"
          [ "$APPLY" = "true" ] && args="$args --apply"
          [ -n "$PRODUCTS" ] && args="$args --products=$PRODUCTS"
          node scripts/restore-products.mjs $args
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-products
          path: restore-products.md
          if-no-files-found: warn
