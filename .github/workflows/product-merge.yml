# TEMPORARY — consolidate two documents that are one game into one product.
#
# Inspects by default. Nothing is hard-deleted: the duplicate is tombstoned only
# after its fields, relations and URL have moved and been read back.
name: Product merge

on:
  workflow_dispatch:
    inputs:
      pairs:
        description: "canonical:duplicate, comma separated (slug or id)"
        type: string
        required: true
      apply:
        description: "Write the changes (leave unchecked to inspect only)"
        type: boolean
        default: false
  push:
    branches: [claude/nintendo-product-template-schema-6dtvza]
    paths:
      - .github/workflows/product-merge.yml
      - scripts/product-merge.mjs

permissions:
  contents: read

concurrency:
  group: product-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # npm, from the committed lockfile. These jobs opened with
      # `bun install --frozen-lockfile`, and there has been no bun lockfile
      # since the tree moved to npm — so every one of them died on its install
      # step, taking the audit and repair tooling with it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.19.1
      - run: npm ci --no-audit --no-fund
      - name: Mask identifiers
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          echo "::add-mask::$ACCOUNT_ID"
          echo "::add-mask::$DATABASE_ID"
      - name: Merge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          PAIRS: ${{ inputs.pairs }}
          APPLY: ${{ inputs.apply }}
        run: |
          [ -z "$PAIRS" ] && { echo "no pairs given — nothing to do"; exit 0; }
          args="--pairs=$PAIRS"
          [ "$APPLY" = "true" ] && args="$args --apply"
          node scripts/product-merge.mjs $args
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-merge
          path: product-merge.md
          if-no-files-found: warn
