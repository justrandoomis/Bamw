# Takes supplier bookkeeping out of the stored copy — dry run by default.
#
# The public serializer already strips these lines on the way out, and it
# works. But an admin is served the record untouched, so the owner checking
# the page after a fix is the one person still shown the fault — which is why
# the same line was reported twice as unfixed. This removes it from the
# document, so every reader agrees.
#
# Text only. The job hashes the document with every text field blanked and
# refuses to write unless that hash is unchanged, so price, cost, stock,
# visibility, the option and type rows, trade-in values, display order and
# sales cannot move through here.
name: Product text repair

on:
  workflow_dispatch:
    inputs:
      needle:
        description: "Slug, title or category fragment"
        type: string
        default: "gift"
      ids:
        description: "Comma-separated product ids or slugs (overrides the needle)"
        type: string
        default: ""
      audit:
        description: "Also print every customer-facing string, in full"
        type: boolean
        default: true
      apply:
        description: "Write the changes (leave unchecked for a dry run)"
        type: boolean
        default: false
  push:
    branches: ["claude/**"]
    paths:
      - "scripts/product-text-repair.mjs"
      - "scripts/lib/text-repair-entry.ts"
      - ".github/workflows/product-text-repair.yml"

permissions:
  contents: read

concurrency:
  group: product-text-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.19.1
      - run: npm ci --no-audit --no-fund

      - name: Mask identifiers
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          echo "::add-mask::$ACCOUNT_ID"
          echo "::add-mask::$DATABASE_ID"

      - name: Repair
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          NEEDLE: ${{ inputs.needle }}
          IDS: ${{ inputs.ids }}
          APPLY: ${{ inputs.apply }}
          AUDIT: ${{ inputs.audit }}
        run: |
          if [ -z "$CLOUDFLARE_D1_DATABASE_ID" ]; then
            CLOUDFLARE_D1_DATABASE_ID=$(node -e "const s=require('fs').readFileSync('wrangler.jsonc','utf8');console.log(/\"database_id\":\s*\"([0-9a-f-]+)\"/.exec(s)[1])")
            echo "::add-mask::$CLOUDFLARE_D1_DATABASE_ID"
            export CLOUDFLARE_D1_DATABASE_ID
          fi
          args=""
          if [ -n "$IDS" ]; then args="--ids=$IDS"; else args="--needle=${NEEDLE:-gift}"; fi
          # A push runs the audit and never writes; only a dispatch can apply.
          if [ "$AUDIT" != "false" ]; then args="$args --audit"; fi
          if [ "$APPLY" = "true" ]; then args="$args --apply"; fi
          echo "mode: $args"
          node scripts/product-text-repair.mjs $args

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-text-repair
          path: product-text-repair.md
          if-no-files-found: warn
