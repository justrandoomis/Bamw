# TEMPORARY — rebuild product_index from the live catalogue.
#
# Dry run by default. Rows are built by the application's own toIndexRow.
name: Rebuild product index

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write the changes (leave unchecked for a dry run)"
        type: boolean
        default: false
  push:
    branches: [claude/nintendo-product-template-schema-6dtvza]
    paths:
      - .github/workflows/rebuild-index.yml
      - scripts/rebuild-index.mjs
      - scripts/lib/index-rebuild-entry.ts

permissions:
  contents: read

concurrency:
  group: rebuild-index
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # npm against the tracked package-lock.json — the repo has no bun
      # lockfile, so `bun install --frozen-lockfile` fails before the
      # rebuild script ever runs. Same setup the catalogue workflows use.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Mask identifiers
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          echo "::add-mask::$ACCOUNT_ID"
          echo "::add-mask::$DATABASE_ID"
      - name: Rebuild
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          APPLY: ${{ inputs.apply }}
        run: |
          # The CLOUDFLARE_D1_DATABASE_ID secret is not set in this repo. The
          # database id is committed configuration, not a secret — the same
          # fallback every catalogue workflow uses.
          if [ -z "$D1_DATABASE_ID" ]; then
            D1_DATABASE_ID=$(node -e "const s=require('fs').readFileSync('wrangler.jsonc','utf8');console.log(/\"database_id\":\s*\"([0-9a-f-]+)\"/.exec(s)[1])")
            export D1_DATABASE_ID
            echo "D1_DATABASE_ID taken from wrangler.jsonc"
          fi
          args=""
          [ "$APPLY" = "true" ] && args="$args --apply"
          node scripts/rebuild-index.mjs $args
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rebuild-index
          path: rebuild-index.md
          if-no-files-found: warn
