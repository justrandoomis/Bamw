# The gate in front of `main`.
#
# Until this existed, nothing checked a pull request. `security.yml` was meant
# to — it declares `on: pull_request` — but GitHub reports its state as
# `disabled_fork` and the API records **zero runs of it, ever**. It would not
# have passed anyway: it opens with `bun install --frozen-lockfile` and this
# repository has no bun lockfile, only the `package-lock.json` npm actually
# installs from. So the four checks in `deploy.yml` were the only ones that
# ran, and they run *after* the merge.
#
# That ordering is the problem this file fixes. A merge to `main` is picked up
# by a Cloudflare build that deploys within about a minute, before the release
# job has finished its first check — so code that fails the gates can already
# be serving customers by the time anything says so. It has happened: on 2 Sep
# the release for PR #16 failed and never deployed, and production was given a
# new version at 17:10:52 regardless.
#
# Running the same four checks *here*, on the pull request, is what makes that
# safe: whatever reaches `main` has already passed them, whichever path then
# deploys it.
name: CI

on:
  pull_request:
  push:
    # `main`, and the branches work is done on.
    #
    # The pull-request trigger is the one that matters and it cannot be relied
    # on alone: on 5 Sep, PR #47 took four pushes and a close-and-reopen without
    # GitHub delivering a single `pull_request` event, so the branch carried no
    # gate at all while `Mobile widths` and the read-only inspectors — both
    # `push` — ran on every one of those commits. A gate that silently does not
    # run is worse than no gate, because the pull request looks unblocked.
    #
    # Running on the branch push as well costs a duplicate run per commit while
    # a pull request is open, and buys a gate that does not depend on one event
    # type being delivered.
    branches: [main, "claude/**"]

permissions:
  contents: read

# A superseded run on the same branch is wasted work; the newest commit is the
# one that matters. `main` is exempt, because each of its pushes is a distinct
# state somebody may need the record of.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Node 22 ships npm 10, and npm 10 cannot install this project at all:
      # resolving vitest's peer set crashes its dependency solver outright
      # ("Cannot read properties of null (reading 'edgesOut')"), and it also
      # rejects a lockfile that carries optional platform packages for other
      # operating systems. npm 11 handles both. Pinned rather than `npm@11`
      # so a future npm release cannot quietly change how the shop installs.
      - run: npm install -g npm@11.19.1

      # `npm ci`, from the committed lockfile: the same resolved tree on every
      # run, here and in the release job, so "passed CI" means "can be
      # deployed". It also fails loudly if package.json and the lockfile have
      # drifted apart, which `npm install` would silently paper over.
      - run: npm ci --no-audit --no-fund

      # The four gates, in the order that fails cheapest first. Each is its own
      # step so a red run names what broke without anyone opening the log.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npx vitest run

      - name: Lint
        run: npx eslint .

      - name: Build
        run: npm run build

      # Advisory. A vulnerable transitive dependency is worth knowing about,
      # but it is not a reason to block a fix to the storefront, and a gate
      # that goes red on somebody else's advisory is a gate people learn to
      # ignore.
      - name: Dependency audit (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high
