# Which picture each gift card actually shows, and which field decided it.
# Read-only.
name: Card images (read-only)

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - scripts/inspect-card-images.mjs
      - .github/workflows/card-images.yml

permissions:
  contents: read

concurrency:
  group: card-images
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The lockfile carries platform-specific optional dependencies the
      # runner's default npm 10 refuses on Linux.
      - run: npm install -g npm@11.19.1
      - run: npm ci --no-audit --no-fund
      - name: Mask identifiers
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "::add-mask::$ACCOUNT_ID"
      - name: Inspect
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/inspect-card-images.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-images
          path: card-images.md
          if-no-files-found: warn
