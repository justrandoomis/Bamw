# The games database: Nintendo Europe's whole Switch / Switch 2 index into the
# D1 table behind /games-db (`nintendo_titles`, `nintendo_title_genres`).
#
# A push runs it DRY: it reads Nintendo's index, the shop's catalogue (for the
# titles the shop sells) and what the table holds, and reports what it would
# write. It writes only when the pushed commit carries an unspent token in
# `scripts/games-db-load.apply-token`, claimed in `console_runs` before the
# first write. It never writes the catalogue (`store_kv`).
#
# Public outputs carry counts and game titles only — this repository is
# public — and no Telegram token is passed.
name: Games database load

on:
  workflow_dispatch:
  push:
    branches: ["main", "claude/**"]
    paths:
      - scripts/games-db-load.mjs
      - scripts/games-db-load.apply-token
      - scripts/lib/games-db-rows.mjs
      - scripts/lib/games-db-entry.ts
      - scripts/lib/nintendo-eu-index.mjs
      - scripts/lib/d1-rest.mjs
      - src/lib/games-db.ts
      - migrations/20261105_nintendo_titles.sql
      - .github/workflows/games-db-load.yml

permissions:
  contents: read

concurrency:
  group: games-db-load
  # Never cancel a run that may be writing; a second one waits.
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The runner's default npm 10 refuses this lockfile on Linux.
      - run: npm install -g npm@11.19.1
      - run: npm ci --no-audit --no-fund
      - name: The loader's tests
        run: npx vitest run scripts/-games-db-loader.test.mjs src/lib/games-db.test.ts
      - name: Mask identifiers
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          echo "::add-mask::$ACCOUNT_ID"
          echo "::add-mask::$DATABASE_ID"
      - name: Load the games database (dry unless the commit carries an unspent token)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: node scripts/games-db-load.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: games-db-load
          path: |
            games-db-load.md
            games-db-load.json
          if-no-files-found: warn
      - name: The summary, last in the log
        if: always()
        run: |
          cat games-db-load.md >> "$GITHUB_STEP_SUMMARY" || true
          tail -c 8000 games-db-load.md || true
