# TEMPORARY — dry-run catalogue audit (Report A + Report B).
#
# Read-only: the script refuses any SQL that is not a single SELECT and touches
# R2 only through read commands. It writes nothing and deploys nothing.
#
# Delete this file, and import-sources/, once the import is finished.
name: Catalogue audit (dry run)

on:
  workflow_dispatch:
    inputs:
      probes:
        description: "R2 existence-probe budget"
        default: "300"
  push:
    branches: [claude/nintendo-product-template-schema-6dtvza]
    paths:
      - .github/workflows/catalogue-audit.yml
      - scripts/catalogue-audit.mjs
      - import-sources/**

permissions:
  contents: read

concurrency:
  group: catalogue-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # npm, from the committed lockfile. These jobs opened with
      # `bun install --frozen-lockfile`, and there has been no bun lockfile
      # since the tree moved to npm — so every one of them died on its install
      # step, taking the audit and repair tooling with it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.19.1
      - run: npm ci --no-audit --no-fund
      - name: Mask identifiers
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          echo "::add-mask::$ACCOUNT_ID"
          echo "::add-mask::$DATABASE_ID"
      - name: Audit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          PROBES: ${{ inputs.probes }}
        run: node scripts/catalogue-audit.mjs --probes=${PROBES:-300}
      - name: Upload the audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-audit
          path: catalogue-audit.md
          if-no-files-found: warn
