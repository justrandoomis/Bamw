# READ ONLY — what the four `/bind_*` commands have recorded.
#
# Setup is four messages sent from inside the four topics of the admin group.
# The update carries `chat.id` and `message_thread_id`, the two numbers
# Telegram shows nobody, so nothing has to be read off a screen and typed in.
# This job reads back what those commands wrote, and answers "did it work"
# from the database rather than by asking again.
#
# It runs one SELECT and writes nothing. It never prints a chat id or a thread
# id — a short fingerprint tells two chats apart without disclosing either.
name: Telegram bindings

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-bindings
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.19.1
      - run: npm ci --no-audit --no-fund

      - name: Mask identifiers
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "::add-mask::$ACCOUNT_ID"

      - name: Read the bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$D1_DATABASE_ID" ]; then
            D1_DATABASE_ID=$(node -e "const s=require('fs').readFileSync('wrangler.jsonc','utf8');console.log(/\"database_id\":\s*\"([0-9a-f-]+)\"/.exec(s)[1])")
            export D1_DATABASE_ID
          fi
          node scripts/telegram-binding-status.mjs
