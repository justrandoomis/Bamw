# The owner's price rise for the yuan at 280: every game price × 1.25, rounded
# UP to the thousand, and every supplier cost × 280 / 220.
#
# «رفع الاسعار التكلفه وسعر البيع · ارفع الاسعار كلها … مثلا mario kart world
#  سعرها الحالي ٩ الف فبعد الزباده تصبح ١٢ الف · وهكذا مع البقيه»
#
# A push runs it DRY: it reads the live catalogue, rehearses every product
# against the document that would be written, and writes nothing. It writes
# only when the pushed commit carries an unspent token in
# `scripts/yuan-reprice.apply-token` — claimed in the `console_runs` ledger
# before the first write, so the same token pushed twice writes once. After a
# complete run the ledger records the rise as done and every later run
# refuses to write.
#
# The log, the step summary and the artifact are public, because this
# repository is. They carry prices, which banan.to already shows, and no
# supplier cost. No Telegram token is passed: the price alerts `updateStore`
# would send are silenced in the script AND have no way out.
name: Yuan reprice apply

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - scripts/yuan-reprice-apply.mjs
      - scripts/yuan-reprice.apply-token
      - scripts/lib/yuan-reprice.mjs
      - scripts/lib/yuan-reprice-apply-entry.ts
      - scripts/lib/store-overlay.mjs
      - .github/workflows/yuan-reprice-apply.yml

permissions:
  contents: read

concurrency:
  group: yuan-reprice-apply
  # Never cancel a run that may be writing prices; a second one waits.
  cancel-in-progress: false

jobs:
  rise:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The runner's default npm 10 refuses this lockfile on Linux.
      - run: npm install -g npm@11.19.1
      - run: npm ci --no-audit --no-fund
      # The rule is held to the owner's own example before it touches a price.
      - name: The rule's tests
        run: npx vitest run scripts/-the-yuan-rise-follows-the-owners-example.test.mjs
      - name: Mask identifiers
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          echo "::add-mask::$ACCOUNT_ID"
          echo "::add-mask::$DATABASE_ID"
      - name: Raise the prices (dry unless the commit carries an unspent token)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: node scripts/yuan-reprice-apply.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yuan-reprice-apply
          path: |
            yuan-reprice-apply.md
            yuan-reprice-apply.json
          if-no-files-found: warn
      # LAST in the log: a job log is read as a tail.
      - name: The summary, last in the log
        if: always()
        run: tail -c 8000 yuan-reprice-apply.md || true
