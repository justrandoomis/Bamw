# The owner's four pricing rules, on a game's four prices.
#
# Dry run by default — that run is the COST REPORT the owner asked for before
# any repricing: «قبل كل شيء أعطني التكلفة للمنتجات». Writing requires the
# `apply` input to be typed, and even then the script refuses the whole run if
# any single proposal breaks a rule.
name: Tier reprice

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Type APPLY to write. Anything else is a dry run."
        type: string
        default: "dry"
      only:
        description: "One product id, or blank for the whole catalogue"
        type: string
        default: ""
      limit:
        description: "Stop after this many products that move (0 = no limit)"
        type: string
        default: "0"
      include_big_moves:
        description: "Also write the large moves (35%+ or 15,000+). Only after their COST has been checked."
        type: boolean
        default: false
  push:
    branches: [claude/gaming-platform-issues-keb1be]
    paths:
      - .github/workflows/tier-reprice.yml
      - scripts/tier-reprice.mjs
      - src/lib/tierRepricing.ts
      - src/lib/tierPricing.ts

permissions:
  contents: read

concurrency:
  group: tier-reprice
  cancel-in-progress: false

jobs:
  reprice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.19.1
      - run: npm ci --no-audit --no-fund
      - name: Mask identifiers
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          echo "::add-mask::$ACCOUNT_ID"
          echo "::add-mask::$DATABASE_ID"
      # The rules are tested against the owner's own worked example. A build
      # that cannot pass them has no business writing prices.
      - name: The rules must pass their own tests first
        run: npx vitest run src/lib/-the-four-prices-follow-the-rules.test.ts src/lib/-four-prices-four-rules.test.ts src/lib/-the-price-follows-the-rule.test.ts
      - name: Reprice
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          APPLY_INPUT: ${{ inputs.apply }}
          ONLY: ${{ inputs.only }}
          LIMIT: ${{ inputs.limit }}
          BIG: ${{ inputs.include_big_moves }}
        run: |
          FLAGS=""
          if [ "$APPLY_INPUT" = "APPLY" ]; then FLAGS="$FLAGS --apply"; fi
          if [ -n "$ONLY" ]; then FLAGS="$FLAGS --only=$ONLY"; fi
          if [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ]; then FLAGS="$FLAGS --limit=$LIMIT"; fi
          if [ "$BIG" = "true" ]; then FLAGS="$FLAGS --include-big-moves"; fi
          node scripts/tier-reprice.mjs --json=tier-reprice.json $FLAGS
      - name: Upload the report and the undo list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-reprice
          path: |
            tier-reprice.md
            tier-reprice.json
          if-no-files-found: warn
      # LAST in the log, deliberately.
      #
      # A job log is read as a tail, and the upload step prints thirty lines of
      # its own after the script finishes — so the figures that decide whether
      # to apply scrolled out of reach and the report had to be guessed at from
      # its own middle. This puts them back at the end, where they can be read.
      - name: The numbers, last in the log
        if: always()
        run: tail -c 6000 tier-reprice.md || true
