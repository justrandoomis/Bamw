# One ordinary offline price per game: every stale lower copy lifted to the
# highest, so a game that rose with the yuan no longer LOOKS as if it did not.
#
# «هنالك العاب لم تتأثر بالصعود او صعودها قليل حل المشكلة … مثل zelda و
#  lego batman و بعض اجزاء ماريو»
#
# A push runs it DRY against the live catalogue. It writes only when the pushed
# commit carries an unspent token in `scripts/offline-price-copies.apply-token`,
# claimed in `console_runs` before the first write. Public outputs carry prices
# only — this repository is public — and no Telegram token is passed.
name: Offline price copies

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - scripts/offline-price-copies.mjs
      - scripts/offline-price-copies.apply-token
      - scripts/lib/offline-price-copies.mjs
      - scripts/lib/offline-price-copies-entry.ts
      - .github/workflows/offline-price-copies.yml

permissions:
  contents: read

concurrency:
  group: offline-price-copies
  # Never cancel a run that may be writing prices; a second one waits.
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The runner's default npm 10 refuses this lockfile on Linux.
      - run: npm install -g npm@11.19.1
      - run: npm ci --no-audit --no-fund
      - name: The rule's tests
        run: npx vitest run scripts/-one-offline-price-per-game.test.mjs
      - name: Mask identifiers
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          echo "::add-mask::$ACCOUNT_ID"
          echo "::add-mask::$DATABASE_ID"
      - name: Sync the offline price copies (dry unless the commit carries an unspent token)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: node scripts/offline-price-copies.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-price-copies
          path: |
            offline-price-copies.md
            offline-price-copies.json
          if-no-files-found: warn
      # LAST in the log: a job log is read as a tail.
      - name: The summary, last in the log
        if: always()
        run: tail -c 8000 offline-price-copies.md || true
