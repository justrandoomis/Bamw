# Can nintendo.com and nintendolife.com actually supply SQUARE art?
#
# «في الصور المربعه وجدت منها في https://www.nintendolife.com
#  وبعضها في او كلها موجوده في https://www.nintendo.com/us/store/products»
#
# READ-ONLY. It reads the catalogue, asks the two sources, downloads a few
# pictures into memory to measure them, and writes NOTHING — not to D1, not to
# R2, not to the catalogue. No price, cost, stock, hidden flag, option, type,
# trade-in value, display order or sales figure is touched.
#
# It runs here rather than in the agent's sandbox because that sandbox's egress
# policy answers 403 to CONNECT for every Nintendo and NintendoLife host —
# measured, not assumed.
name: Square source probe

on:
  workflow_dispatch:
    inputs:
      sample:
        description: "How many of the games missing art to actually ask about"
        required: false
        default: "40"
      deadline:
        description: "Minutes it may spend before it stops and reports what it has"
        required: false
        default: "12"
  # A new or edited probe runs itself, so it can be trusted before it is relied
  # on. It reads and never writes, so a push trigger risks nothing.
  push:
    branches: ["claude/**"]
    paths:
      - scripts/square-source-probe.mjs
      - .github/workflows/square-source-probe.yml

permissions:
  contents: read

concurrency:
  group: square-source-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The runner's default npm 10 refuses this lockfile on Linux.
      - run: npm install -g npm@11.19.1
      - run: npm ci --no-audit --no-fund
      - name: Mask identifiers
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          echo "::add-mask::$ACCOUNT_ID"
          echo "::add-mask::$DATABASE_ID"
      - name: Ask both sources and measure what comes back
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          SAMPLE: ${{ inputs.sample }}
          DEADLINE: ${{ inputs.deadline }}
        run: |
          node scripts/square-source-probe.mjs \
            --sample "${SAMPLE:-40}" \
            --deadline "${DEADLINE:-12}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: square-source-probe
          path: square-source-probe.md
          if-no-files-found: warn
      # LAST in the log, deliberately: a job log is read as a tail and the
      # upload step prints thirty lines of its own after the script finishes.
      - name: The numbers, last in the log
        if: always()
        run: tail -c 2500 square-source-probe.md || true
