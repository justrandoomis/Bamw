# What the shop paid for what it sells.
#
# «لكن قبل كل شيء أعطني التكلفة للمنتجات» — the owner wants to reprice the
# catalogue against cost and asked for the cost picture first. This prints it.
#
# Read-only, and deliberately so: it bundles `getStore` and reads the catalogue
# document. There is no write path in the script at all, so a repricing cannot
# happen by accident from here — it is a separate, guarded run.
name: Cost report

on:
  workflow_dispatch:
    inputs:
      json:
        description: "Also upload the full per-game table as an artifact"
        type: boolean
        default: true
  push:
    branches: [claude/gaming-platform-issues-keb1be]
    paths:
      - .github/workflows/cost-report.yml
      - scripts/cost-report.mjs
      - scripts/lib/catalogue-entry.ts

permissions:
  contents: read

concurrency:
  group: cost-report
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The lockfile carries platform-specific optional dependencies the
      # runner's default npm 10 refuses on Linux; every workflow here upgrades
      # first for the same reason.
      - run: npm install -g npm@11.19.1
      - run: npm ci --no-audit --no-fund

      - name: Mask identifiers
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "::add-mask::$ACCOUNT_ID"

      - name: Read the catalogue's costs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: node scripts/cost-report.mjs --json cost-report.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cost-report
          path: cost-report.json
