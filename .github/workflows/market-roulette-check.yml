# Is the rebuilt market — and the roulette — really on banan.to?
#
# «لا تقل «تم» بناءً على Build فقط؛ المطلوب تحقق وظيفي كامل على الإنتاج.»
#
# READ-ONLY, and needing no secrets at all: it opens the public site in a real
# mobile browser and reads the screens. It never signs in, never spins — a spin
# costs a ticket and awards a prize, so a verification that spun would create
# commercial data to prove a page renders — and writes nothing anywhere.
#
# It runs on demand, after a deploy, rather than on every push, because what it
# measures is production and production only changes when something ships.
name: Market and roulette check

on:
  workflow_dispatch:
    inputs:
      origin:
        description: "Origin to read"
        type: string
        default: "https://banan.to"
  # A new or edited checker runs itself, so it can be trusted before it is
  # relied on. It reads and never writes, so a push trigger risks nothing.
  push:
    branches: ["claude/**"]
    paths:
      - scripts/market-roulette-check.mjs
      - .github/workflows/market-roulette-check.yml

permissions:
  contents: read

concurrency:
  group: market-roulette-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The runner's default npm 10 refuses this lockfile on Linux.
      - run: npm install -g npm@11.19.1
      - run: npm ci --no-audit --no-fund
      # `playwright-core` carries no installer, so the browser comes from the
      # `playwright` CLI, pinned to the version the other checkers pin.
      - name: Install Chromium
        run: npx --yes playwright@1.62.1 install --with-deps chromium
      - name: Read the screens
        env:
          ORIGIN: ${{ inputs.origin }}
        run: node scripts/market-roulette-check.mjs --origin "${ORIGIN:-https://banan.to}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-roulette-check
          path: market-roulette-check.md
          if-no-files-found: warn
      # LAST in the log, deliberately: a job log is read as a tail and the
      # upload step prints thirty lines of its own after the script finishes.
      - name: The numbers, last in the log
        if: always()
        run: tail -c 2000 market-roulette-check.md || true
