# What production costs, measured rather than reasoned about.
#
# READ ONLY: SELECTs, unauthenticated GETs, and one read query against Workers
# Logs. It deploys nothing and writes nothing.
name: Perf probe (read-only)

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "How far back to sample the CPU record"
        type: string
        default: "6"
      windows:
        description: "How many slices to sample it in"
        type: string
        default: "8"
  push:
    branches: [claude/gaming-platform-issues-keb1be]
    paths:
      - .github/workflows/perf-probe.yml
      - scripts/perf-probe.mjs

permissions:
  contents: read

concurrency:
  group: perf-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.19.1
      - run: npm ci --no-audit --no-fund
      - name: Mask identifiers
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "::add-mask::$ACCOUNT_ID"
      - name: Probe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/perf-probe.mjs --hours "${{ inputs.hours || '6' }}" --windows "${{ inputs.windows || '8' }}"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-probe
          path: perf-probe.md
          if-no-files-found: warn
