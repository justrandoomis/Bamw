# Did the repricing reach the shop, or only the database? READ ONLY.
#
# «لا تقل «تم» بناءً على Build فقط؛ المطلوب تحقق وظيفي كامل على الإنتاج.»
name: Tier reprice — verify on banan.to

on:
  workflow_dispatch:
    inputs:
      origin:
        description: "Origin to read"
        type: string
        default: "https://banan.to"
  push:
    branches: [claude/gaming-platform-issues-keb1be]
    paths:
      - scripts/tier-reprice-verify.mjs
      - scripts/lib/pricing-entry.ts
      - .github/workflows/tier-reprice-verify.yml

permissions:
  contents: read

concurrency:
  group: tier-reprice-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.19.1
      - run: npm ci --no-audit --no-fund
      - name: Read the live shop
        env:
          ORIGIN: ${{ inputs.origin || 'https://banan.to' }}
        run: node scripts/tier-reprice-verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tier-reprice-verify
          path: tier-reprice-verify.md
          if-no-files-found: warn
      - name: The numbers, last in the log
        if: always()
        run: tail -c 4000 tier-reprice-verify.md || true
