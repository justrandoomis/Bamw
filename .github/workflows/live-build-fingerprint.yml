# Is the build banan.to serves the one on `main`? READ ONLY.
#
# A Workers Builds deploy records no commit, so `whats-live` can name the
# serving version but not what it holds. This opens the shop in a real browser
# and checks for things only the recent build does.
name: Live build fingerprint

on:
  workflow_dispatch:
    inputs:
      origin:
        description: "Origin to read"
        type: string
        default: "https://banan.to"
  # A new or edited checker runs itself. It reads and never writes.
  push:
    branches: ["claude/**"]
    paths:
      - scripts/live-build-fingerprint.mjs
      - .github/workflows/live-build-fingerprint.yml

permissions:
  contents: read

concurrency:
  group: live-build-fingerprint
  cancel-in-progress: true

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The runner's default npm 10 refuses this lockfile on Linux.
      - run: npm install -g npm@11.19.1
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx --yes playwright@1.62.1 install --with-deps chromium
      - name: Read the live build
        env:
          ORIGIN: ${{ inputs.origin }}
        run: node scripts/live-build-fingerprint.mjs --origin "${ORIGIN:-https://banan.to}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-build-fingerprint
          path: live-build-fingerprint.md
          if-no-files-found: warn
      - name: The verdict, last in the log
        if: always()
        run: tail -c 2000 live-build-fingerprint.md || true
