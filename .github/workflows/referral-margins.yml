# Which categories can afford a referral. Read-only.
#
# The programme gives away a fifth of the price of a referred sale, and whether
# that is a promotion or a loss is a fact about the margin — which differs
# between a game account, a console and a top-up card. This asks the live
# catalogue instead of guessing, and prints ratios only: no product's price or
# cost reaches the artifact.
name: Referral margins (read-only)

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - scripts/inspect-referral-margins.mjs
      - .github/workflows/referral-margins.yml

permissions:
  contents: read

concurrency:
  group: referral-margins
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The lockfile carries platform-specific optional dependencies the
      # runner's default npm 10 refuses on Linux.
      - run: npm install -g npm@11.19.1
      - run: npm ci --no-audit --no-fund
      - name: Mask identifiers
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "::add-mask::$ACCOUNT_ID"
      - name: Inspect
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/inspect-referral-margins.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: referral-margins
          path: referral-margins.md
          if-no-files-found: warn
