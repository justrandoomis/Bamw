# Where does the roulette's price line belong, measured against the real shop?
#
# READ-ONLY. It reads the catalogue and the roulette's flags table and prints
# numbers. No price, cost, stock, hidden flag, option, type, trade-in value,
# display order, sales figure, ticket, prize or order is written by anything
# this runs.
#
# It exists because the owner asked for the boundary to be designed against
# Bamw's actual prices — «صمم الحدود وفق الأسعار الفعلية في Bamw» — and the
# shop's prices moved the same day: the repricing put ordinary Switch games at
# 7,000–9,000, so a line at 5,000 may leave the cheap half of the roulette
# empty.
name: Roulette pool probe

on:
  workflow_dispatch:
    inputs:
      boundary:
        description: "Price boundary to report the buckets at (blank = the default)"
        required: false
        default: ""
  # A new or edited probe runs itself, so it can be used from a branch before
  # it merges. It reads and never writes, so a push trigger risks nothing.
  push:
    branches: ["claude/**"]
    paths:
      - scripts/roulette-pool-probe.mjs
      - scripts/lib/roulette-entry.ts
      - .github/workflows/roulette-pool-probe.yml

permissions:
  contents: read

concurrency:
  group: roulette-pool-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.19.1
      - run: npm ci --no-audit --no-fund
      - name: Mask identifiers
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          echo "::add-mask::$ACCOUNT_ID"
          echo "::add-mask::$DATABASE_ID"
      - name: Measure
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: node scripts/roulette-pool-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roulette-pool-probe
          path: roulette-pool-probe.md
          if-no-files-found: warn
      # LAST in the log, deliberately: a job log is read as a tail.
      - name: The numbers, last in the log
        if: always()
        run: tail -c 2000 roulette-pool-probe.md || true
