# Finish the supplier catalogue import from a runner instead of a browser.
#
# The admin modal posts a batch at a time to a Worker, and this shop is on the
# Cloudflare Workers Free plan — wrangler said so itself, refusing a `limits`
# block with error 100328. A catalogue write does not fit in the CPU a request
# on that plan is allowed, which is why the owner's run dies partway with an
# HTML 503. A runner has no such ceiling.
#
# Dry run by default. `apply` is a separate, deliberate tick, and `create-only`
# is the default mode: in that mode an existing product is skipped entirely, so
# no price, cost, stock, visibility, option, type, trade-in value or ordering of
# anything already in the shop can change.
name: Catalogue import (runner)

run-name: Catalogue import — ${{ inputs.apply && 'APPLY' || 'dry run' }} · ${{ inputs.mode || 'refresh-content' }}

on:
  workflow_dispatch:
    inputs:
      file:
        description: "CSV path in the repository"
        type: string
        default: "import-sources/catalogue.csv"
      mode:
        description: "create-only: touch nothing existing · refresh-content: title+cover only, never money · refresh-prices: price+cost only"
        type: choice
        options: [create-only, refresh-content, refresh-prices]
        default: create-only
      apply:
        description: "Write. Leave off to see what it would do."
        type: boolean
        default: false
      batch:
        description: "Rows per write"
        type: string
        default: "100"

  # A dispatch is only accepted for a workflow on the default branch, so until
  # this merges a push is the only way to exercise it. A push can never write:
  # `apply` is an input, and an input a push does not supply is empty, so the
  # run below is always a dry run.
  push:
    branches: [claude/gaming-platform-issues-keb1be]
    paths:
      - import-sources/catalogue.csv
      - scripts/catalogue-import-runner.mjs
      - scripts/lib/catalogue-import-entry.ts
      - .github/workflows/catalogue-import.yml

permissions:
  contents: read

concurrency:
  group: catalogue-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Mask identifiers
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          echo "::add-mask::$ACCOUNT_ID"
          echo "::add-mask::$DATABASE_ID"
      - name: Import
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          node scripts/catalogue-import-runner.mjs \
            --file "${{ inputs.file || 'import-sources/catalogue.csv' }}" \
            --mode "${{ inputs.mode || 'refresh-content' }}" \
            --batch "${{ inputs.batch || '100' }}" \
            ${{ inputs.apply && '--apply' || '' }}
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-import
          path: catalogue-import-runner.md
          if-no-files-found: warn
      - name: Summary
        if: always()
        run: cat catalogue-import-runner.md >> "$GITHUB_STEP_SUMMARY" || true
