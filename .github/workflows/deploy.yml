# Deploys the Worker to Cloudflare.
#
# Deployment was a `wrangler deploy` typed on somebody's laptop, which means the
# gate in front of production was whatever that person happened to run first.
# Here the gate is the job: typecheck, the full test suite and a real build all
# have to pass before wrangler is invoked at all.
#
# Two modes, and `preview` is the default on purpose:
#   preview — uploads a version and serves none of it. Cloudflare gives the
#             version a preview URL; production keeps serving what it served.
#   release — the upload plus the traffic shift. This is the one that changes
#             what a customer sees.
#
# Migrations are their own opt-in input, off by default, because applying them
# is the only step here that touches customer data and it is not reversible by
# re-running the job.
name: Deploy

# A run that only uploaded a version and a run that actually served it are the
# same word in the Actions list, and both go green. That is how a "successful
# Deploy" can leave production exactly as it was — `mode` defaults to `preview`,
# so a dispatch with no inputs uploads and shifts no traffic. Naming the mode in
# the run title is what makes the two distinguishable at a glance.
run-name: Deploy — ${{ inputs.rollback_to && 'rollback' || inputs.mode || 'preview' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = upload a version, serve none of it · release = serve it"
        type: choice
        options: [preview, release]
        default: preview
      migrate:
        description: "Apply pending D1 migrations to the production database first"
        type: boolean
        default: false
      rollback_to:
        description: "Version id to send 100% of traffic to. Set this and nothing is built — it only shifts traffic to a version that already exists."
        type: string
        default: ""
  # A `workflow_dispatch` is only accepted for a workflow on the default branch,
  # so until this merges a push is the only way to exercise the pipeline. A push
  # can only ever reach `preview` — `MODE` below falls back to it and `release`
  # is unreachable without someone choosing it — so this trigger cannot change
  # what a customer sees, and it is scoped to the files that define the deploy.
  push:
    branches: [claude/nintendo-product-template-schema-6dtvza]
    paths:
      - .github/workflows/deploy.yml
      - scripts/verify-deployment.mjs

permissions:
  contents: read

# One deploy at a time, and never cancel one half-way: a cancelled wrangler run
# can leave the upload done and the traffic shift not.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # `inputs` is empty on a push, so the fallback is what a push runs: a
      # version upload that serves no traffic. `release` only ever comes from
      # someone choosing it in the dispatch form.
      MODE: ${{ inputs.mode || 'preview' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # npm against the tracked package-lock.json. This job ran
      # `bun install --frozen-lockfile` and the repository has no bun lockfile,
      # so it failed before anything else could — which is why this pipeline had
      # never completed a single run. Same setup the catalogue and index
      # workflows use.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Node 22 ships npm 10, which cannot install this project: resolving
      # vitest's peer set crashes its dependency solver. See `ci.yml`.
      - run: npm install -g npm@11.19.1

      # `npm ci` from the committed lockfile, so the release installs exactly
      # the tree CI gated — not whatever the registry resolves to today.
      - run: npm ci --no-audit --no-fund

      - name: Mask identifiers
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "::add-mask::$ACCOUNT_ID"

      - name: Say what is being deployed
        run: |
          echo "ref:    ${{ github.ref_name }}"
          echo "commit: ${{ github.sha }}"
          echo "mode:   $MODE"
          echo "migrate: ${{ inputs.migrate }}"

      # The gate. Nothing below runs if any of these four fail.
      #
      # These were advisory for exactly one release, because `main` could not
      # pass them: 101 type errors and 78 failing tests, none of it in the
      # changes waiting to ship. Held as blocking in that state they protected
      # nothing — they only meant nothing could ever be deployed, which is the
      # state this repository was actually in. The baseline is green now
      # (0 type errors, 1487 tests passing, 0 lint errors), so they block again.
      #
      # Build is the one that answers the question a deploy asks: `npm run
      # build` is `vite build` plus scripts/verify-cloudflare-bundle.mjs, which
      # checks the Worker entry points at dist/server/server.js and that fetch,
      # queue, scheduled and the ChatRealtimeDO binding are all exported. A
      # bundle that fails it cannot serve, so nothing is uploaded.
      #
      # A rollback skips all of it. The version being rolled back to was already
      # built, tested and uploaded, and rebuilding it would defeat the point:
      # the reason to roll back is that what is serving now is bad, and the
      # fastest safe move is to serve something known good that already exists.
      - name: Typecheck
        if: ${{ !inputs.rollback_to }}
        run: npm run typecheck

      - name: Test
        if: ${{ !inputs.rollback_to }}
        run: npx vitest run

      - name: Lint
        if: ${{ !inputs.rollback_to }}
        run: npx eslint .

      - name: Build
        if: ${{ !inputs.rollback_to }}
        run: npm run build

      # Read-only, and unconditional: seeing what *would* run is how an operator
      # decides whether the migrate input is safe to tick. Wrangler tracks
      # applied migrations in `d1_migrations`; if that table was never created,
      # every file in `migrations/` counts as pending and applying them would be
      # a re-run against a live database rather than an update to it.
      - name: List pending D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations list bananto --remote --config wrangler.jsonc || true

      # Opt-in, and before the code that expects the new shape goes live.
      - name: Apply D1 migrations
        if: ${{ inputs.migrate }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply bananto --remote --config wrangler.jsonc

      - name: Upload a version (no traffic)
        if: ${{ env.MODE == 'preview' && !inputs.rollback_to }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler versions upload \
            --config wrangler.jsonc \
            --message "${{ github.sha }} from ${{ github.ref_name }}"

      # Upload the version, then give it the traffic — the two halves of a
      # deploy, run as two commands.
      #
      # `wrangler deploy` does both in one, and then reconciles the zone's
      # worker routes, which this API token is not permitted to read: the first
      # release run uploaded the Worker, took 100% of traffic, and *then* failed
      # on GET /zones/…/workers/routes with "Authentication error [code:
      # 10000]". A red job for a deploy that had already succeeded is worse than
      # useless — it invites someone to roll back a release that was fine.
      #
      # The routes for banan.to already exist and this pipeline never changes
      # them, so the reconciliation had nothing to do. Splitting the deploy
      # skips it entirely and uses the same traffic-shift call the rollback path
      # has always used. If the token is ever granted Zone → Workers Routes,
      # `wrangler deploy` becomes an option again — it is not needed for this.
      - name: Deploy — upload the version
        id: upload_release
        if: ${{ env.MODE == 'release' && !inputs.rollback_to }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler versions upload \
            --config wrangler.jsonc \
            --message "${{ github.sha }} from ${{ github.ref_name }}" | tee upload.log
          # Wrangler prints "Worker Version ID: <uuid>". Take it from there
          # rather than guessing at the newest version, which would race
          # anything else uploading.
          version="$(grep -oiE 'Worker Version ID:[[:space:]]*[0-9a-f-]{8,}' upload.log \
            | tail -1 | grep -oiE '[0-9a-f-]{8,}$')"
          if [ -z "$version" ]; then
            echo "could not read the uploaded version id from wrangler output" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "uploaded version $version"

      - name: Deploy — send it the traffic
        if: ${{ env.MODE == 'release' && !inputs.rollback_to }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler versions deploy "${{ steps.upload_release.outputs.version }}@100%" \
            --config wrangler.jsonc --yes \
            --message "release ${{ github.sha }}"

      # Shifts all traffic to a version that already exists. Nothing is built,
      # nothing is uploaded, and the routes are not touched — which matters,
      # because it is the route reconciliation that the API token cannot do.
      - name: Roll traffic back to a known-good version
        if: ${{ inputs.rollback_to }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Reports show version ids truncated to eight characters, so that is
          # what anyone typing a rollback will have. Resolve it to the full id
          # rather than failing on the API call, which is what happened the
          # first time this ran.
          full="$(node scripts/resolve-worker-version.mjs "${{ inputs.rollback_to }}")"
          echo "rolling back to $full"
          npx wrangler versions deploy "$full@100%" \
            --config wrangler.jsonc --yes \
            --message "rollback to $full"

      # Outside-in, against the public hostname. "wrangler reported success" and
      # "banan.to answers correctly" are different claims. A rollback is checked
      # the same way: restoring service is a claim about the site, not about
      # wrangler's exit code.
      - name: Verify the live site
        if: ${{ env.MODE == 'release' || inputs.rollback_to }}
        run: node scripts/verify-deployment.mjs

      - name: Read back what Cloudflare is serving
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deployment-state.mjs || true

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-${{ env.MODE }}
          path: |
            deployment-verification.md
            deployment-state.md
          if-no-files-found: warn
