# READ ONLY — ask Cloudflare what is actually deployed.
#
# The repository cannot answer this: there is no deploy workflow in it, and a
# branch being pushed is not a branch being served.
name: Deployment state

on:
  workflow_dispatch:
  push:
    branches: [claude/nintendo-product-template-schema-6dtvza]
    paths:
      - .github/workflows/deployment-state.yml
      - scripts/deployment-state.mjs

permissions:
  contents: read

concurrency:
  group: deployment-state
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Mask identifiers
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "::add-mask::$ACCOUNT_ID"
      - name: Inspect
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deployment-state.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-state
          path: deployment-state.md
          if-no-files-found: warn
