# What the referral programme is actually set to in production. Read-only.
#
# The defaults in `config.ts` are only what a store with no saved settings
# gets. Once the settings block has been saved once, the stored values win for
# ever — so changing a default fixes nothing on a shop that has one. This asks
# the live document before any code is touched.
name: Referral settings (read-only)

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - scripts/inspect-referral-settings.mjs
      - .github/workflows/referral-settings.yml

permissions:
  contents: read

concurrency:
  group: referral-settings
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The lockfile carries platform-specific optional dependencies the
      # runner's default npm 10 refuses on Linux.
      - run: npm install -g npm@11.19.1
      - run: npm ci --no-audit --no-fund
      - name: Mask identifiers
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "::add-mask::$ACCOUNT_ID"
      - name: Inspect
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/inspect-referral-settings.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: referral-settings
          path: referral-settings.md
          if-no-files-found: warn
