# Why will one product not take a new price?
#
# A hundred and four of a hundred and five prices were written and read back
# from D1. One came back at its old price on three consecutive runs, so this is
# not a lost race — something about that record refuses the write. Reading the
# code found nothing, so this asks the database.
#
# Read-only unless `write` is ticked, and even then it writes ONE field of ONE
# product and reads it back from D1 with the cache dropped.
name: Probe product

run-name: Probe ${{ inputs.id }} — ${{ inputs.write && 'write + read back' || 'read only' }}

on:
  workflow_dispatch:
    inputs:
      id:
        description: "Product id"
        type: string
        default: "prd_34be2de35cbe4d6b"
      write:
        description: "Write the price and read it back"
        type: boolean
        default: false
      price:
        description: "Price to write"
        type: string
        default: "12000"
  push:
    branches: [claude/gaming-platform-issues-keb1be]
    paths:
      - .github/workflows/probe-product.yml
      - scripts/probe-product.mjs

permissions:
  contents: read

concurrency:
  group: probe-product
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.19.1
      - run: npm ci --no-audit --no-fund
      - name: Mask identifiers
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "::add-mask::$ACCOUNT_ID"
      - name: Probe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          PID: ${{ inputs.id }}
          WRITE: ${{ inputs.write && '--write' || '' }}
          NEW_PRICE: ${{ inputs.price }}
        run: node scripts/probe-product.mjs --id "${PID:-prd_34be2de35cbe4d6b}" $WRITE --price "${NEW_PRICE:-12000}"
