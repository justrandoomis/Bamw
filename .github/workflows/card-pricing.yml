# Which field is pricing a card, and which is picturing it. Read-only.
#
# A gift card whose admin screen shows 7,500 everywhere renders 7,000 on its
# product page, and no edit moves it. That is a surface reading a different
# field from the one the editor writes, and this prints every list that can
# price the product in the order the detail page consults them.
name: Card pricing (read-only)

on:
  workflow_dispatch:
    inputs:
      product:
        description: "Product id or slug"
        required: true
        default: "nintendo-eshop-gift-card-5-usd-usa"
  push:
    branches: ["claude/**"]
    paths:
      - scripts/inspect-card-pricing.mjs
      - .github/workflows/card-pricing.yml

permissions:
  contents: read

concurrency:
  group: card-pricing
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The lockfile carries platform-specific optional dependencies the
      # runner's default npm 10 refuses on Linux.
      - run: npm install -g npm@11.19.1
      - run: npm ci --no-audit --no-fund
      - name: Mask identifiers
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "::add-mask::$ACCOUNT_ID"
      - name: Inspect
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCT: ${{ inputs.product }}
        run: node scripts/inspect-card-pricing.mjs "${PRODUCT:-nintendo-eshop-gift-card-5-usd-usa}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-pricing
          path: card-pricing.md
          if-no-files-found: warn
