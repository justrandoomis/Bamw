# TEMPORARY — image re-point repair.
#
# Dry run by default: the script writes nothing unless `apply` is set, and the
# only statement it can write is a single INSERT targeting one product's
# overlay row by immutable id.
#
# Delete this file once the recovery is closed.
name: Repair images

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write the changes (leave unchecked for a dry run)"
        type: boolean
        default: false
      batch:
        description: "Products per batch"
        default: "5"
      products:
        description: "Optional comma-separated product ids to limit the run to"
        default: ""
      limit:
        description: "How many products this run covers"
        default: "25"
      offset:
        description: "Where in the catalogue this run starts"
        default: "0"
  push:
    branches: [claude/nintendo-product-template-schema-6dtvza]
    paths:
      - .github/workflows/repair-images.yml
      - scripts/repair-images.mjs

permissions:
  contents: read

concurrency:
  group: incident-audit
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # npm, from the committed lockfile. These jobs opened with
      # `bun install --frozen-lockfile`, and there has been no bun lockfile
      # since the tree moved to npm — so every one of them died on its install
      # step, taking the audit and repair tooling with it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.19.1
      - run: npm ci --no-audit --no-fund
      - name: Mask identifiers
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          echo "::add-mask::$ACCOUNT_ID"
          echo "::add-mask::$DATABASE_ID"
      - name: Repair
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          APPLY: ${{ inputs.apply }}
          BATCH: ${{ inputs.batch }}
          PRODUCTS: ${{ inputs.products }}
          LIMIT: ${{ inputs.limit }}
          OFFSET: ${{ inputs.offset }}
        run: |
          args=""
          [ "$APPLY" = "true" ] && args="$args --apply"
          [ -n "$BATCH" ] && args="$args --batch=$BATCH"
          [ -n "$PRODUCTS" ] && args="$args --products=$PRODUCTS"
          [ -n "$LIMIT" ] && args="$args --limit=$LIMIT"
          [ -n "$OFFSET" ] && args="$args --offset=$OFFSET"
          node scripts/repair-images.mjs $args
      - name: Upload the plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-images
          path: repair-images.md
          if-no-files-found: warn
