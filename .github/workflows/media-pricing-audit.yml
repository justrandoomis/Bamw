# TEMPORARY — read-only. Reports what every image role actually contains and
# how price relates to cost across the live catalogue. Writes nothing: the
# script has no apply flag and its only D1 statements are SELECTs.
name: Media and pricing audit

on:
  workflow_dispatch:
    inputs:
      products:
        description: "Optional comma-separated product ids or slugs"
        default: ""
      limit:
        description: "Audit at most this many products (0 = all)"
        default: "0"
  push:
    branches: [claude/nintendo-product-template-schema-6dtvza]
    paths:
      - .github/workflows/media-pricing-audit.yml
      - scripts/media-pricing-audit.mjs

permissions:
  contents: read

concurrency:
  group: media-pricing-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # npm, from the committed lockfile. These jobs opened with
      # `bun install --frozen-lockfile`, and there has been no bun lockfile
      # since the tree moved to npm — so every one of them died on its install
      # step, taking the audit and repair tooling with it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.19.1
      - run: npm ci --no-audit --no-fund
      - name: Mask identifiers
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "::add-mask::$ACCOUNT_ID"
      - name: Audit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          PRODUCTS: ${{ inputs.products }}
          LIMIT: ${{ inputs.limit }}
        run: |
          args="--limit=${LIMIT:-0}"
          [ -n "$PRODUCTS" ] && args="$args --products=$PRODUCTS"
          node scripts/media-pricing-audit.mjs $args
      # The full report is long. The headline numbers belong in the log too,
      # so a reader does not have to download an artifact to see them.
      - name: Summary
        if: always()
        run: |
          sed -n '1,12p' media-pricing-audit.md || true
          grep -E '^- (Products whose|Products with no|Image references|Distinct URLs|Products storing)' media-pricing-audit.md || true
          echo
          sed -n '/^### References that are not images/,/^$/p' media-pricing-audit.md | head -3 || true
          sed -n '/what the server actually returned/,/^$/p' media-pricing-audit.md || true
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-pricing-audit
          path: media-pricing-audit.md
          if-no-files-found: warn
