# TEMPORARY — read-only. Counts what is actually in production.
name: Production proof

on:
  workflow_dispatch:
  push:
    branches: [claude/nintendo-product-template-schema-6dtvza]
    paths:
      - .github/workflows/production-proof.yml
      - scripts/production-proof.mjs

permissions:
  contents: read

concurrency:
  group: production-proof
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # npm, from the committed lockfile. These jobs opened with
      # `bun install --frozen-lockfile`, and there has been no bun lockfile
      # since the tree moved to npm — so every one of them died on its install
      # step, taking the audit and repair tooling with it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.19.1
      - run: npm ci --no-audit --no-fund
      - name: Mask identifiers
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "::add-mask::$ACCOUNT_ID"
      - name: Count production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: node scripts/production-proof.mjs
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-proof
          path: production-proof.md
          if-no-files-found: warn
